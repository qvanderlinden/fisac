[project]
name = "fisac"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.138",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "python-dateutil>=2.9",
    "httpx>=0.27",
    "qv-auth @ git+https://github.com/qvanderlinden/auth@v0.1.0#subdirectory=python",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "pyjwt[crypto]>=2.10"]

# Task 10 removes this local path source once the v0.1.0 tag exists.
[tool.uv.sources]
qv-auth = { path = "../auth/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/fisac"]

[tool.hatch.metadata]
allow-direct-references = true
